<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自洽系统 v6.0</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ========== 顶部栏 ========== -->
<header id="topbar">
  <div class="topbar-left">
    <span id="avatarWrap"><img id="avatarImg" style="display:none"></span>
    <span id="systemIcon">☀️</span>
    <span id="systemTitle">自洽系统</span>
    <span id="versionTag">v6.0.0</span>
  </div>
  <div class="topbar-right">
    <span id="charName"></span>
    <button id="btnCreateMode" title="创造模式">🔧创造模式</button>
  </div>
</header>

<!-- ========== 导航标签 ========== -->
<nav id="tabs">
  <button class="tabBtn active" data-tab="dashboard">📊仪表盘</button>
  <button class="tabBtn" data-tab="record">✏️记录</button>
  <button class="tabBtn" data-tab="operations">⚡操作项</button>
  <button class="tabBtn" data-tab="palace">🔮十二宫</button>
  <button class="tabBtn" data-tab="daily">📅日报</button>
  <button class="tabBtn" data-tab="report">📋报告</button>
  <button class="tabBtn" data-tab="skill">🌳技能树</button>
  <button class="tabBtn" data-tab="relation">👥关系图谱</button>
  <button class="tabBtn" data-tab="achievement">🏆成就</button>
  <button class="tabBtn" data-tab="manual">📖说明书</button>
</nav>

<!-- ========== 页面容器 ========== -->
<main id="pages"></main>

<!-- ========== 底部栏 ========== -->
<footer id="bottombar">
  <button onclick="decayDailyWrap()">🌙每日衰减</button>
  <button onclick="bumpVersion()">⬆️版本+1</button>
  <button onclick="exportJSON()">📤导出JSON</button>
  <button onclick="exportDOC()">📄导出DOC</button>
  <button onclick="document.getElementById('importFile').click()">📥导入</button>
  <input type="file" id="importFile" style="display:none" onchange="importData(event)">
  <button onclick="resetAll()" style="color:#ef4444">🔄重置</button>
</footer>

<!-- ========== 密码弹窗（居中） ========== -->
<div id="pwdModal" class="pwd-modal">
  <div class="pwd-box">
    <div class="icon">🔧</div>
    <h3>创造模式</h3>
    <p>请输入密码以进入创造模式</p>
    <input type="password" id="pwdInput" placeholder="输入密码" style="text-align:center;font-size:16px;letter-spacing:2px;margin:8px 0;width:80%">
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px">
      <button class="btn btn-primary" id="pwdSubmit">确 认</button>
      <button class="btn btn-ghost" id="pwdCancel">取 消</button>
    </div>
  </div>
</div>

<!-- ========== 创造模式弹窗 ========== -->
<div id="createModal" class="modal">
  <div class="modal-content">
    <header class="modal-header">
      <span>🔧创造模式</span>
      <button onclick="closeCreateMode()">✕</button>
    </header>
    <div id="createBody"></div>
  </div>
</div>

<!-- ========== 庆祝弹窗 ========== -->
<div id="celebrateModal" class="modal">
  <div class="modal-content celebrate">
    <div id="celebrateBody"></div>
  </div>
</div>

<!-- ========== JS 脚本（按顺序加载） ========== -->
<script src="js/data.js"></script>
<script src="js/calc.js"></script>
<script src="js/render.js"></script>
<script src="js/actions.js"></script>
<script src="js/export.js"></script>
<script src="js/create.js"></script>
<script src="js/main.js"></script>

</body>
</html>
